name: Submit Google News Sitemap

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: '30 * * * *'

  workflow_dispatch:
    inputs:
      title:
        description: 'Titre de l article'
        required: false
      url:
        description: 'URL de l article'
        required: false
      date:
        description: 'Date ISO'
        required: false

permissions:
  contents: read

jobs:
  submit-news-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Submit News Sitemap to Google
        env:
          GSC_JSON_KEY: ${{ secrets.GSC_JSON_KEY }}
          INPUT_URL: "${{ github.event.inputs.url }}"
        run: python index_news.py
